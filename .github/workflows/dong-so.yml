# ĐÓNG SỔ KHI GỘP — Đợt DỌN-6, 21/10/2026
#
# VÌ SAO CÓ VIỆC NÀY. Đo trên main `06369d2` ngày 20/10/2026: 6 trên 7 dòng `đang làm` là dòng đã
# chết — việc đã nằm trên main, chỉ là chưa ai đóng dòng. Sổ nói sai sáu lần trên bảy. Và trong 36
# giờ ngày 16–17/10, 27 dòng chết phải nhờ làn đi sau dọn hộ (DỌN-5 đóng 20, TM-1 đóng 4, R3b đóng 3).
#
# Gốc: dòng được GHI lúc làn bắt đầu, nhưng chỗ duy nhất đúng để ĐÓNG là lúc PR gộp — mà lúc ấy mọi
# script của làn đã chạy xong, việc gộp diễn ra trên GitHub. Không có gì gắn vào sự kiện gộp.
#
# ĐÃ CHẠY THỬ trên 185 lần gộp thật của main trước khi viết tệp này. Luật và phép đo dùng CHUNG một
# tệp `backend/tools/dong_so.py`, nên hai thứ không thể lệch nhau.
#
# VÌ SAO `[skip ci]`. Commit ghi sổ chỉ đổi đúng một ô trạng thái. Để ci.yml chạy lại trên nó thì
# tốn thêm một vòng `web` + `docker` cho mỗi lần gộp — kho này đã chạm trần chi tiêu Actions ngày
# 19/9 và 17/10. Đổi lại: nếu commit này làm hỏng sổ thì cửa hẹp của LẦN GỘP KẾ TIẾP mới bắt được,
# chứ không bắt ngay. Chấp nhận, vì `test_giu_cho_lan` và `test_ds1` đã canh đúng chỗ ấy.
name: Đóng sổ khi gộp

# TẮT KÍCH HOẠT TỰ ĐỘNG — Đợt SO-1, 22/10/2026. ĐỌC TRƯỚC KHI BẬT LẠI.
#
# VIỆC NÀY KHÔNG HỎNG. Nó tính đúng rồi không ghi được. Lượt #5 (`4b939df`) và #6 (`3a73454`) đều
# đỏ cùng một chỗ: `main` từ chối commit ghi sổ bằng GH006, vì rào đòi `hang-rao-gop` mà một commit
# vừa sinh ra thì chưa có lượt kiểm nào chạy cho nó. Sau Đợt DỌN-7 nó thôi nuốt lỗi, nên màu đỏ ấy
# là thật — và nó sẽ lặp lại ở MỌI lần gộp, mãi mãi, cho tới khi cửa vượt rào mở ra.
#
# ĐÃ THỬ MỞ CỬA ẤY, KHÔNG MỞ ĐƯỢC. Ngày 22/10/2026 rào `main` kiểu cũ đã chuyển thành hai ruleset
# (`main-1` giữ chặn xoá nhánh và chặn force push, `main-2` giữ bắt buộc `hang-rao-gop`). Bảng
# Bypass list của `main-2` mở ra đủ ba nhóm, và KHÔNG nhóm nào chào con bot Actions:
#     Roles  : Organization admin, Repository admin, Maintain, Write
#     Apps   : Copilot code review, Copilot cloud agent, GitHub Agentic Autofix,
#              GitHub Code Quality Agent, Render, Vercel
#     Others : chỉ Deploy keys
# Nghĩa là lời khuyên ở bước `Ghi lại sổ` phía dưới — «cho github-actions[bot] vào danh sách vượt
# rào» — hiện KHÔNG thực hiện được ở kho này. Lời khuyên ấy vẫn để nguyên, vì nó đúng về nguyên
# tắc và `test_ds2_3` canh nó; chỗ sai là ở chỗ GitHub chưa cho, không phải ở chỗ viết.
#
# VIỆC ẤY NAY CHẠY Ở ĐÂU. Tại làn, trước mỗi lần đẩy. `DONG_SO_LAN.py` — tệp của làn, KHÔNG nằm
# trong kho — gọi THẲNG `backend/tools/dong_so.py`, tức cùng một tệp luật mà việc này gọi và cùng
# một tệp mà `test_ds1` canh. Nó đi qua những lần gộp chưa xử lý trên `origin/main`, đóng dòng, rồi
# để kết quả đi cùng vòng kế tiếp qua PR như mọi thay đổi khác. Chậm hơn đúng một vòng, nhưng ghi
# được — mà một ô trạng thái ghi muộn một vòng vẫn hơn hẳn một ô không bao giờ ghi.
#
# BẬT LẠI KHI NÀO. Khi `github-actions` xuất hiện trong Bypass list của `main-2`, hoặc khi kho có
# một deploy key quyền ghi nằm trong danh sách ấy. Lúc đó đổi `on:` bên dưới về
#     on:
#       push:
#         branches: [main]
# là xong — phần còn lại của tệp không phải sửa một chữ, và năm phép thử `test_ds2` không đụng tới
# khối `on:` nên chúng xanh ở cả hai trạng thái.
#
# ĐỂ LẠI `workflow_dispatch` để còn chạy tay mà đọc nhật ký khi muốn thử lại cửa vượt rào.
on:
  workflow_dispatch:

permissions:
  contents: write

# Hai lần gộp sát nhau không được cùng ghi sổ một lúc. KHÔNG huỷ cái đang chạy: huỷ giữa chừng là
# bỏ sót một dòng đáng đóng.
concurrency:
  group: dong-so-main
  cancel-in-progress: false

jobs:
  dong-so:
    # CHỐT 5: bỏ qua commit của chính việc này. Không có dòng này thì nó tự kích vòng lặp.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Chỉ chạy trên commit gộp
        id: loc
        run: |
          set -eu
          if ! git rev-parse --verify -q HEAD^2 >/dev/null; then
            echo "khong phai commit gop — bo qua"
            echo "chay=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --deepen=5 origin main >/dev/null 2>&1 || true
          tieu="$(git log -1 --format=%s)"
          nhanh="$(printf '%s' "$tieu" | sed -n 's|.*from [^/]*/\([^ ]*\).*|\1|p')"
          if [ -z "$nhanh" ]; then
            echo "khong doc duoc ten nhanh tu: $tieu"
            echo "chay=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --name-only HEAD^1 HEAD > doi_tep.txt
          echo "nhanh=$nhanh" >> "$GITHUB_OUTPUT"
          echo "chay=1" >> "$GITHUB_OUTPUT"
          echo "nhanh: $nhanh"
          echo "tep doi: $(wc -l < doi_tep.txt)"

      - name: Đóng dòng
        if: steps.loc.outputs.chay == '1'
        run: |
          set -eu
          python backend/tools/dong_so.py \
            --goc . --nhanh "${{ steps.loc.outputs.nhanh }}" \
            --doi-tep "$(cat doi_tep.txt)" --that
          rm -f doi_tep.txt

      - name: Ghi lại sổ
        if: steps.loc.outputs.chay == '1'
        run: |
          set -eu
          if git diff --quiet; then echo "so khong doi — khong commit"; exit 0; fi
          # CHỐT 1: một ký tự đổi ngoài docs/dang-lam/ là dừng hẳn, không commit gì.
          ngoai="$(git diff --name-only | grep -v '^docs/dang-lam/' || true)"
          if [ -n "$ngoai" ]; then
            echo "DUNG — co tep doi NGOAI so: $ngoai"; exit 1
          fi
          git config user.name "VTOS đóng sổ"
          git config user.email "noreply@anthropic.com"
          git add docs/dang-lam
          git commit -m "Đóng sổ: ${{ steps.loc.outputs.nhanh }} đã gộp [skip ci]"
          # ĐẨY — Đợt DỌN-7, 21/10/2026. HỎNG THÌ ĐỎ, không nuốt.
          #
          # Lần đầu việc này chạy (ngay sau khi PR #405 gộp) nó đóng ĐÚNG dòng DỌN-6, rồi `main`
          # từ chối đẩy bằng GH006 — mà việc CI vẫn báo Success, vì dòng cũ kết thúc bằng
          # `|| echo "day khong duoc"`. Sổ không đổi một chữ, và không ai biết. `test_ds2_1`
          # canh đúng chỗ ấy.
          if git push 2>day_loi.txt; then cat day_loi.txt; exit 0; fi
          cat day_loi.txt
          if grep -q 'GH006' day_loi.txt; then
            echo "::error::main dang chan day thang (GH006). Day KHONG phai loi ma: cho github-actions[bot] vao danh sach vuot rao (bypass) cua nhanh main trong Settings, khong thi viec nay khong bao gio ghi duoc so."
            exit 1
          fi
          # Lần gộp khác vừa hạ cánh trước: rebase rồi thử lại ĐÚNG MỘT lần. Hỏng nữa thì đỏ.
          git pull --rebase origin main
          git push
