name: VTOS robots (lịch tự động)
# Lịch chạy robot trên web thật – không tốn hạ tầng: GitHub Actions gọi API VTOS bằng ROBOT_TOKEN (Settings → Secrets → ROBOT_TOKEN, cùng giá trị Render).
# LỊCH ĐÃ GỠ 25/10/2026 — ROBOT CHẠY TRÊN MÁY CHỦ TỊCH
#
# 24/10 ngân sách Actions chạm trần lần thứ tư (19/9 · 17/10 · 21/10 · 24/10) và mọi lượt
# chạy bị chặn: «The job was not started because recent account payments have failed or
# your spending limit needs to be increased». Robot chết theo.
#
# 25/10 lịch chuyển sang máy Chủ tịch: sáu việc trong Task Scheduler gọi
# `0-BAM-R1/ROBOT-MAY-NHA.py`, đúng giờ cũ.
#
# VÌ SAO GỠ HẲN CHỨ KHÔNG ĐỂ ĐÓ: 01/11 sang kỳ mới, trần đầy lại, lịch này TỰ SỐNG LẠI.
# Khi ấy hai lịch cùng chạy, mà hai đường `/robot/inbox/check` và
# `/robot/zalo/send-pending` mỗi lượt là MỘT TIN NHẮN GỬI CHO KHÁCH — hai lịch là khách
# nhận hai lần, và tin đã bay sang Zalo thì không rút về được. Chính tệp này đã ghi điều
# ấy ở hàm `goi_mot_lan` bên dưới.
#
# Dựa vào việc NHỚ tắt trước 01/11 là một cách canh tồi. Gỡ hẳn thì không thể trùng.
#
# Sáu dòng cũ giữ nguyên văn ở đây — giờ giấc do Chủ tịch chốt qua nhiều vòng (26/9,
# 09/10), xoá hẳn thì ngày muốn bật lại phải dựng lại từ trí nhớ:
#
#   - cron: "10 0 * * *"      # 07:10 giờ VN: đồng bộ Vietrip + quyết toán tour kết thúc 10 ngày
#   - cron: "10 11 * * *"     # 18:10 giờ VN: lượt thứ hai trong ngày
#   - cron: "*/30 0-15 * * *" # mỗi 30 phút giờ hành chính VN (07:00–22:00): kéo bù SePay, chốt sự vụ hết hạn
#   - cron: "30 13 * * *"     # 20:30 giờ VN: robot R7 báo cáo ngày
#   - cron: "0 2 * * 6"       # Thứ Bảy 09:00 VN: báo cáo tuần
#   - cron: "0 2 10 * *"      # ngày 10 hằng tháng 09:00 VN: báo cáo tháng
#
# BẤM TAY VẪN CHẠY: `workflow_dispatch` giữ nguyên. Không có lịch thì
# `github.event.schedule` rỗng, việc «Chọn việc theo lịch» lấy `inputs.job` với mặc định
# `vietrip` — nên Actions → VTOS robots → Run workflow vẫn dùng được như cũ.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "vietrip | sepay | ngay | tuan | thang | vietrip_products"
        default: "vietrip"

# QUYỀN CHỈ-ĐỌC — TR-10, 13/11/2026.
#
# Tệp này gọi API của hệ thống bằng `secrets.ROBOT_TOKEN` của RIÊNG nó, chứ không dùng
# `GITHUB_TOKEN` để ghi gì vào kho. Nên token của Actions ở đây chỉ cần đủ để `checkout`.
# Đáng làm nhất ở đúng tệp này: nó là tệp duy nhất mang `ROBOT_TOKEN` — chiếc khoá đã từng
# lọt ra một lần (đã xoay 13/11/2026) — nên quyền quanh nó càng hẹp càng tốt.
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # Hạn giờ. Thiếu dòng này GitHub lấy mặc định 360 phút MỘT VIỆC, nên một việc treo ăn hết ngân sách
    # mà không ai thấy nó đến — trần đã bị chạm bốn lần: 19/9 · 17/10 · 21/10 · 24/10. Số để RỘNG hơn
    # số đo được nhiều lần, vì hạn giờ chật biến một lượt chậm-nhưng-đúng thành đỏ, và đỏ-vì-hạ-tầng
    # là thứ dạy người ta tắt hàng rào. Đợt CI-1, 25/10/2026.
    timeout-minutes: 45
    env:
      API: https://vtos-api.onrender.com/api/v1
      TOKEN: ${{ secrets.ROBOT_TOKEN }}
    steps:
      - name: Đánh thức API và CHỜ tới khi thật sự sẵn sàng
        # Render free ngủ khi rảnh, và máy chủ 512 MB có thể đang khởi động lại sau khi quá bộ nhớ.
        # Gọi robot ngay lúc đó sẽ dính 502 và làm hỏng cả lượt chạy, nên phải chờ /health trả 200 rồi mới chạy.
        run: |
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "$API/health" || echo 000)
            echo "lần $i: /health → $CODE"
            [ "$CODE" = "200" ] && sleep 5 && exit 0
            sleep 20
          done
          echo "::error::API không sẵn sàng sau ~5 phút – bỏ lượt chạy này"
          exit 1
      - name: Chọn việc theo lịch
        id: pick
        run: |
          J="${{ github.event.inputs.job }}"
          if [ -z "$J" ]; then
            case "${{ github.event.schedule }}" in
              "10 0 * * *") J=vietrip ;;
              "10 11 * * *") J=vietrip ;;
              "*/30 0-15 * * *") J=sepay ;;
              "30 13 * * *") J=ngay ;;
              "0 2 * * 6") J=tuan ;;
              "0 2 10 * *") J=thang ;;
            esac
          fi
          echo "job=$J" >> $GITHUB_OUTPUT
      - name: Chạy robot
        run: |
          J="${{ steps.pick.outputs.job }}"; H="X-Robot-Token: $TOKEN"; C="Content-Type: application/json"
          FAIL=0
          # Gọi một API robot: thử lại 3 lần (Render có thể đang khởi động lại), ghi rõ việc nào hỏng
          # thay vì để cả lượt chạy chết ở lệnh curl đầu tiên như trước.
          call() {
            ten="$1"; shift
            if curl -sS --fail-with-body --retry 3 --retry-delay 15 --retry-all-errors "$@"; then
              echo "✔ $ten"
            else
              echo "::error::✘ $ten thất bại"; FAIL=1
            fi
          }
          # GỌI MỘT LẦN — KHÔNG THỬ LẠI. Dùng cho đường có tác động RA NGOÀI công ty.
          #
          # ĐO ĐƯỢC, không suy (Đợt KS-17, 21/10/2026). Dựng một máy chủ làm việc lâu hơn hạn rồi
          # gọi bằng ĐÚNG dòng `call` ở trên: curl báo hỏng BỐN lần, nhưng máy chủ NHẬN BỐN yêu cầu
          # và LÀM XONG CẢ BỐN. `--retry-all-errors` thử lại cả khi hết hạn chờ (mã 28), mà hết hạn
          # chờ KHÔNG có nghĩa là việc chưa chạy — máy chủ vẫn chạy tiếp sau khi curl bỏ đi.
          #
          # Với hai đường dưới đây, mỗi lần chạy là một TIN NHẮN GỬI CHO KHÁCH. Tin đã bay đi thì
          # không rút về được, nên thà bỏ một lượt 30 phút còn hơn gửi trùng.
          goi_mot_lan() {
            ten="$1"; shift
            if curl -sS --fail-with-body "$@"; then
              echo "✔ $ten"
            else
              echo "::error::✘ $ten thất bại — KHÔNG gọi lại, lượt sau sẽ làm nốt"; FAIL=1
            fi
          }
          case "$J" in
            vietrip)
              call "đồng bộ Vietrip" -m 120 -X POST "$API/robot/vietrip/sync" -H "$H" -H "$C" -d '{"settlements_days":10}'
              sleep 600
              call "robot chạy nền" -m 170 -X POST "$API/robot/run" -H "$H"
              call "soát booking" -m 170 -X POST "$API/robot/bookings/check" -H "$H"
              call "robot R9" -m 170 -X POST "$API/robot/r9/auto" -H "$H"
              # 28/9/2026: dựng lại sổ nghĩa vụ để hai khối Phải thu · Phải trả (màn hình Chủ tịch)
              # có số mới sau mỗi lượt kéo Vietrip.
              call "dựng sổ nghĩa vụ (phải thu/phải trả)" -m 170 -X POST "$API/dong-tien/robot/nghia-vu/dong-bo" -H "$H" ;;
            vietrip_products)
              call "đồng bộ sản phẩm Vietrip" -m 120 -X POST "$API/robot/vietrip/sync" -H "$H" -H "$C" -d '{"products":true,"settlements_days":10}' ;;
            sepay)
              call "kéo giao dịch SePay" -m 120 -X POST "$API/robot/sepay/pull" -H "$H" -H "$C" -d '{}'
              call "chốt sự vụ hết hạn" -m 60 -X POST "$API/robot/incidents/finalize" -H "$H"
              goi_mot_lan "soát hộp thư" -m 170 -X POST "$API/robot/inbox/check" -H "$H"
              goi_mot_lan "gửi Zalo còn treo" -m 170 -X POST "$API/robot/zalo/send-pending" -H "$H" ;;
            ngay|tuan|thang)
              # 30/9/2026: vòng quét Kiểm soát đi TRƯỚC báo cáo, và đi ở đây vì tới ngày này nó chưa
              # có lịch nào cả. Hậu quả đo được trên hệ thật: lần quét cuối là 10/9, nên suốt 19 ngày
              # bàn giám sát của Chủ tịch là MỘT TẤM ẢNH CŨ – nó vẫn treo đỏ
              # "POST /api/v1/robot/sepay/pull ×116" trong khi bảng sự kiện kỹ thuật 7 ngày gần nhất
              # không còn lượt nào của đường dẫn ấy. Một bàn giám sát không tự làm mới thì sai theo
              # cả hai chiều: báo việc đã hết, và im lặng với việc mới.
              call "quét Kiểm soát" -m 170 -X POST "$API/kiem-soat/robot/quet" -H "$H"
              call "báo cáo $J" -m 170 -X POST "$API/robot/report/$J" -H "$H" -H "$C" -d '{}' ;;
          esac
          exit $FAIL
