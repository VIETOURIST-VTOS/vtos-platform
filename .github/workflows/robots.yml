name: VTOS robots (lịch tự động)
# Lịch chạy robot trên web thật – không tốn hạ tầng: GitHub Actions gọi API VTOS bằng ROBOT_TOKEN (Settings → Secrets → ROBOT_TOKEN, cùng giá trị Render).
on:
  schedule:
    # Chủ tịch chốt 26/9/2026: kéo Vietrip HAI LẦN MỖI NGÀY, thay cho một lượt 3 giờ sáng.
    # Chủ tịch đổi giờ 09/10/2026: *"đặt lịch hàng ngày 7 giờ sáng và 6 giờ chiều nạp dữ liệu
    # doanh thu, quyết toán, lợi nhuận từ vietrip qua vtos"*. Lượt chiều GIỮ NGUYÊN — nó đã là
    # 18:10 VN từ 26/9; chỉ lượt sáng dời 11:10 → 07:10.
    #
    # Giờ VN là UTC+7 và không đổi theo mùa: 07:00 VN = 00:00 UTC, 18:00 VN = 11:00 UTC.
    #
    # Vì sao lệch 10 phút chứ không đúng phút 0, và vì sao giờ mới VẪN phải lệch: lịch SePay ở
    # dòng dưới chạy mỗi 30 phút trong khung 0-15 UTC, nên nó nổ đúng cả 00:00 lẫn 11:00 UTC. Máy
    # chủ chỉ có 512 MB và tự khởi động lại khi quá bộ nhớ (xem chú thích ở bước đánh thức API bên
    # dưới), nên cho hai việc nặng cùng bấm một giây là tự chuốc 502. Dịch 10 phút là đủ tránh mà
    # vẫn đúng ý "7 giờ sáng và 6 giờ chiều".
    #
    # MỘT LƯỢT NÀY KÉO ĐỦ BA THỨ Chủ tịch nêu: `robot/vietrip/sync` lấy tour, booking, phiếu thu
    # và bảng quyết toán (`settlements_days: 10`); lợi nhuận KHÔNG kéo riêng vì nó là số TÍNH RA
    # từ doanh thu trừ giá vốn (`services/ket_qua_that`), không phải số Vietrip có sẵn để chép.
    - cron: "10 0 * * *"      # 07:10 giờ VN: đồng bộ Vietrip + quyết toán tour kết thúc 10 ngày
    - cron: "10 11 * * *"     # 18:10 giờ VN: lượt thứ hai trong ngày
    - cron: "*/30 0-15 * * *" # mỗi 30 phút giờ hành chính VN (07:00–22:00): kéo bù SePay, chốt sự vụ hết hạn
    - cron: "30 13 * * *"     # 20:30 giờ VN: robot R7 báo cáo ngày
    - cron: "0 2 * * 6"       # Thứ Bảy 09:00 VN: báo cáo tuần
    - cron: "0 2 10 * *"      # ngày 10 hằng tháng 09:00 VN: báo cáo tháng
  workflow_dispatch:
    inputs:
      job:
        description: "vietrip | sepay | ngay | tuan | thang | vietrip_products"
        default: "vietrip"
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      API: https://vtos-api.onrender.com/api/v1
      TOKEN: ${{ secrets.ROBOT_TOKEN }}
    steps:
      - name: Đánh thức API và CHỜ tới khi thật sự sẵn sàng
        # Render free ngủ khi rảnh, và máy chủ 512 MB có thể đang khởi động lại sau khi quá bộ nhớ.
        # Gọi robot ngay lúc đó sẽ dính 502 và làm hỏng cả lượt chạy, nên phải chờ /health trả 200 rồi mới chạy.
        run: |
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "$API/health" || echo 000)
            echo "lần $i: /health → $CODE"
            [ "$CODE" = "200" ] && sleep 5 && exit 0
            sleep 20
          done
          echo "::error::API không sẵn sàng sau ~5 phút – bỏ lượt chạy này"
          exit 1
      - name: Chọn việc theo lịch
        id: pick
        run: |
          J="${{ github.event.inputs.job }}"
          if [ -z "$J" ]; then
            case "${{ github.event.schedule }}" in
              "10 0 * * *") J=vietrip ;;
              "10 11 * * *") J=vietrip ;;
              "*/30 0-15 * * *") J=sepay ;;
              "30 13 * * *") J=ngay ;;
              "0 2 * * 6") J=tuan ;;
              "0 2 10 * *") J=thang ;;
            esac
          fi
          echo "job=$J" >> $GITHUB_OUTPUT
      - name: Chạy robot
        run: |
          J="${{ steps.pick.outputs.job }}"; H="X-Robot-Token: $TOKEN"; C="Content-Type: application/json"
          FAIL=0
          # Gọi một API robot: thử lại 3 lần (Render có thể đang khởi động lại), ghi rõ việc nào hỏng
          # thay vì để cả lượt chạy chết ở lệnh curl đầu tiên như trước.
          call() {
            ten="$1"; shift
            if curl -sS --fail-with-body --retry 3 --retry-delay 15 --retry-all-errors "$@"; then
              echo "✔ $ten"
            else
              echo "::error::✘ $ten thất bại"; FAIL=1
            fi
          }
          case "$J" in
            vietrip)
              call "đồng bộ Vietrip" -m 120 -X POST "$API/robot/vietrip/sync" -H "$H" -H "$C" -d '{"settlements_days":10}'
              sleep 600
              call "robot chạy nền" -m 170 -X POST "$API/robot/run" -H "$H"
              call "soát booking" -m 170 -X POST "$API/robot/bookings/check" -H "$H"
              call "robot R9" -m 170 -X POST "$API/robot/r9/auto" -H "$H"
              # 28/9/2026: dựng lại sổ nghĩa vụ để hai khối Phải thu · Phải trả (màn hình Chủ tịch)
              # có số mới sau mỗi lượt kéo Vietrip.
              call "dựng sổ nghĩa vụ (phải thu/phải trả)" -m 170 -X POST "$API/dong-tien/robot/nghia-vu/dong-bo" -H "$H" ;;
            vietrip_products)
              call "đồng bộ sản phẩm Vietrip" -m 120 -X POST "$API/robot/vietrip/sync" -H "$H" -H "$C" -d '{"products":true,"settlements_days":10}' ;;
            sepay)
              call "kéo giao dịch SePay" -m 120 -X POST "$API/robot/sepay/pull" -H "$H" -H "$C" -d '{}'
              call "chốt sự vụ hết hạn" -m 60 -X POST "$API/robot/incidents/finalize" -H "$H"
              call "soát hộp thư" -m 60 -X POST "$API/robot/inbox/check" -H "$H"
              call "gửi Zalo còn treo" -m 60 -X POST "$API/robot/zalo/send-pending" -H "$H" ;;
            ngay|tuan|thang)
              # 30/9/2026: vòng quét Kiểm soát đi TRƯỚC báo cáo, và đi ở đây vì tới ngày này nó chưa
              # có lịch nào cả. Hậu quả đo được trên hệ thật: lần quét cuối là 10/9, nên suốt 19 ngày
              # bàn giám sát của Chủ tịch là MỘT TẤM ẢNH CŨ – nó vẫn treo đỏ
              # "POST /api/v1/robot/sepay/pull ×116" trong khi bảng sự kiện kỹ thuật 7 ngày gần nhất
              # không còn lượt nào của đường dẫn ấy. Một bàn giám sát không tự làm mới thì sai theo
              # cả hai chiều: báo việc đã hết, và im lặng với việc mới.
              call "quét Kiểm soát" -m 170 -X POST "$API/kiem-soat/robot/quet" -H "$H"
              call "báo cáo $J" -m 170 -X POST "$API/robot/report/$J" -H "$H" -H "$C" -d '{}' ;;
          esac
          exit $FAIL
