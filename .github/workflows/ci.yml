# CI CHẠY HAI HÌNH, VÀ ĐÓ LÀ CHỦ Ý — 19/9/2026
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# VÌ SAO ĐỔI
# ─────────────────────────────────────────────────────────────────────────────────────────────
#
# Bản trước khai `push: [main, develop]` VÀ `pull_request`. Hệ quả: bộ 251 tệp phép thử ~24 phút
# chạy HAI LẦN cho cùng một công việc — một lần trên PR, một lần nữa trên main sau khi gộp.
#
# Lần thứ nhất CHẶN được: đỏ thì không gộp. Lần thứ hai thì mã đã nằm trong kho rồi, đỏ cũng không
# chặn được gì nữa — nó chỉ BÁO. Và cái giá của việc báo ấy là một nửa hoá đơn.
#
# Đo ngày 19/9/2026: tháng này kho dùng 7.974 phút cho ci.yml. Trần chi tiêu Actions chạm đáy lúc
# 13 giờ và GitHub DỪNG HẲN mọi việc — "The job was not started because recent account payments
# have failed or your spending limit needs to be increased". Bốn làn cùng đứng, không ai đẩy được.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# NHƯNG KHÔNG BỎ HẲN CI TRÊN MAIN — VÌ CÓ MỘT LOẠI HỎNG CHỈ MAIN MỚI THẤY
# ─────────────────────────────────────────────────────────────────────────────────────────────
#
# Hai PR cùng xanh RIÊNG LẺ vẫn có thể hỏng khi GỘP LẠI: làn A thêm một bản di trú, làn B cũng
# thêm một bản — mỗi nhánh một đầu mạch nên cả hai đều xanh, gộp xong thành hai đầu và hộp chứa
# chết lúc khởi động. Cùng hình ấy với bảng phân quyền, bảng khai cửa nhập, bảng giữ chỗ làn.
#
# Đúng ngày 19/9 chuyện này suýt xảy ra HAI LẦN trong một buổi chiều: một nhánh dựng trên bản kho
# cũ suýt xoá mất TC-71, rồi sau khi dựng lại thì TC-73 vào kho và suýt bị xoá tiếp. Cả hai lần CI
# ĐỀU KHÔNG BẮT ĐƯỢC trên PR — vì xoá một màn hình của làn khác thì phép thử vẫn xanh.
#
# Nên main VẪN có một cửa kiểm, nhưng là cửa HẸP và NHANH: đúng những phép thử soi chuyện hai làn
# đụng nhau. 86 phép thử, 12 giây, thay vì 251 tệp và 24 phút.
#
#   · test_mach_migration                 – đúng MỘT đầu mạch di trú
#   · test_menu                           – mọi màn hình trong ma trận đều có lối vào
#   · test_p11_khai_quyen_phai_co_man_hinh – mọi mục khai quyền đều có trang thật
#   · test_ks_ma_tran                     – không khai quyền cho màn hình không tồn tại
#   · test_p2_pham_vi_vai_tro             – bảng phạm vi ĐÃ CHỐT khớp với mã
#   · test_giu_cho_lan                    – hai làn không cùng giữ một tệp
#   · test_giu_cho_nhanh                  – đẩy mã lên mà không có dòng `đang làm` thì đỏ (23/9)
#   · test_ks_do_dai                      – độ dài chuỗi khớp bề rộng cột
#   · test_ks2_khai_quyen_may_doc_duoc    – mọi cửa ghi đều khai quyền máy đọc được
#   · test_ks_cua_nhap                    – mọi bảng đều khai một cửa nhập
#   · test_man_hinh_co_cua_nhap           – màn hình có số thì phải có cửa nhập số ấy
#
# `backend/tests/test_ci_hang_rao_main.py` ĐỌC CHÍNH TỆP NÀY và đỏ nếu một tệp kể trên bị đổi tên
# hay xoá đi. Không có phép thử ấy thì một tệp đổi tên sẽ làm cửa kiểm này lặng lẽ chạy thiếu, và
# một cửa kiểm chạy thiếu mà vẫn xanh là thứ nguy hiểm hơn không có cửa nào.
#
# MUỐN CHẠY ĐỦ BỘ TRÊN MAIN: vào Actions → CI → "Run workflow". `workflow_dispatch` để sẵn cho
# việc ấy — trước khi ra bản thật, hoặc khi nghi một lần gộp làm hỏng thứ cửa hẹp không soi tới.
name: CI
on:
  pull_request:
  push: { branches: [main, develop] }
  workflow_dispatch:

# ĐẨY LẦN HAI THÌ HUỶ LƯỢT ĐANG CHẠY CỦA LẦN MỘT — 27/9/2026.
#
# Bộ đủ mất ~25 phút và GitHub tính tiền theo PHÚT ĐÃ CHẠY, không theo lượt có ai đọc kết quả hay
# không. Khi một vòng sửa phải đẩy vài lần — hôm 27/9 nhánh TC-65 đẩy bốn lần — thì ba lượt đầu
# vẫn chạy hết 25 phút cho một bản mã KHÔNG AI CÒN QUAN TÂM. Đó là ~75 phút trả tiền cho kết quả
# đã lỗi thời trước khi nó kịp hiện.
#
# Đo ngày 27/9: ngân sách Actions chạm trần $50, mức tiêu ba ngày gần nhất là $4,58 · $4,94 ·
# $5,50 mỗi ngày. Trần đầy thì CI KHÔNG CHẠY, và trang PR vẫn khoe "All checks have passed" vì
# Vercel xanh — một màu xanh giả, nguy hiểm hơn hẳn màu đỏ.
#
# Nhóm theo SỐ PR chứ không theo `github.ref`: cùng một PR đẩy tiếp thì huỷ lượt cũ, còn hai PR
# khác nhau thì không đụng nhau. `github.ref` trên sự kiện pull_request là `refs/pull/N/merge` nên
# cũng tách được, nhưng để số PR lên trước thì đọc log biết ngay đang nói về PR nào.
#
# NHƯNG KHÔNG HUỶ TRÊN MAIN — Chủ tịch chốt 21/10/2026.
#
# Chỗ hở ghi ở việc `hang-rao-gop` phía dưới từ 09/10 đã thành chuyện thật. Đo ngày 21/10: trong
# TÁM lượt gần nhất trên main, NĂM lượt bị huỷ. Lượt bị huỷ không cho tín hiệu nào, nên main
# không được đo — và đúng lúc ấy nó đang đỏ mà không ai biết: lượt #977 của PR #402 đỏ, lượt
# #978 trên main bị huỷ, PR gộp, ba phép thử đỏ sống BỐN NGÀY qua bốn lần gộp nữa, tới lượt #983
# chạy hết mới lộ ra. Sửa ở Đợt TC-72b (#418).
#
# Trên PR, huỷ là đúng: đẩy lần hai thì bản cũ không ai còn quan tâm. Trên main thì ngược hẳn —
# mã đã vào kho, lượt chạy ấy là THỨ DUY NHẤT nói main còn xanh hay không, và huỷ nó là tự bịt
# mắt để tiết kiệm vài phút. Giá phải trả: hai lần gộp sát nhau thì chạy cả hai, mỗi lượt ~55
# phút. Chủ tịch chốt trả giá ấy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ĐỢT DỌN-8 22/10/2026 — LẦN CHẠY NÀY CÓ CHỈ CHẠM SỔ GIỮ CHỖ KHÔNG?
  #
  # Chỉ sinh ra để trả lời một câu, cho một việc: PR do robot đóng sổ mở ra chỉ đổi ĐÚNG MỘT Ô
  # CHỮ trong `docs/dang-lam/`, mà nếu nó kéo cả `backend` ~55 phút thì nhịp gộp ~10 lần/ngày
  # thành ~9 giờ máy mỗi ngày. Trần chi tiêu Actions đã chạm đáy ba lần: 19/9, 17/10, 21/10.
  #
  # TRƯỢT VỀ PHÍA CHẠY ĐỦ. Mọi chỗ còn ngờ — không đọc được danh sách tệp, diff rỗng, chạy trên
  # push — đều trả 0, tức là CHẠY ĐỦ BỘ. Bỏ qua nhầm thì mất một lớp canh mà không ai biết; chạy
  # thừa thì chỉ tốn máy, và tốn máy là thứ đo được.
  loc:
    runs-on: ubuntu-latest
    # Hạn giờ. Thiếu dòng này GitHub lấy mặc định 360 phút MỘT VIỆC, nên một việc treo ăn hết ngân sách
    # mà không ai thấy nó đến — trần đã bị chạm bốn lần: 19/9 · 17/10 · 21/10 · 24/10. Số để RỘNG hơn
    # số đo được nhiều lần, vì hạn giờ chật biến một lượt chậm-nhưng-đúng thành đỏ, và đỏ-vì-hạ-tầng
    # là thứ dạy người ta tắt hàng rào. Đợt CI-1, 25/10/2026.
    timeout-minutes: 10
    outputs:
      chi_so: ${{ steps.do.outputs.chi_so }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: do
        run: |
          set -eu
          # TRÊN MAIN THÌ KHÔNG BAO GIỜ BỎ QUA. Quyết định 16/10 (bộ đủ chạy cả trên push, để
          # bắt chuyện hai PR xanh riêng lẻ gộp lại thành đỏ) KHÔNG bị đợt này đụng tới.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "chay tren main — khong bao gio bo qua"
            echo "chi_so=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          nen="${{ github.base_ref }}"
          [ -n "$nen" ] || nen="main"
          git fetch --no-tags origin "$nen" >/dev/null 2>&1 || true
          doi="$(git diff --name-only "origin/$nen...HEAD" || true)"
          if [ -z "$doi" ]; then
            echo "khong doc duoc danh sach tep doi — chay du bo cho chac"
            echo "chi_so=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "--- $(printf '%s\n' "$doi" | wc -l) tep doi ---"
          ngoai="$(printf '%s\n' "$doi" | grep -v '^docs/dang-lam/' || true)"
          if [ -z "$ngoai" ]; then
            echo "CHI CHAM SO GIU CHO — bo qua bo du; cua hep hang-rao-gop van chay"
            echo "chi_so=1" >> "$GITHUB_OUTPUT"
          else
            echo "co tep ngoai so:"; printf '%s\n' "$ngoai"
            echo "chi_so=0" >> "$GITHUB_OUTPUT"
          fi

  # ĐỦ BỘ — trên PR (cửa CHẶN) VÀ trên main (cửa ĐO).
  #
  # CHẠY CẢ TRÊN PUSH TỪ 16/10/2026 — Chủ tịch quyết, sau một ngày mất vì đúng chỗ hở này.
  #
  # Trước đó việc này khai `if: github.event_name != 'push'`, với lý do nghe rất hợp: mã đã vào
  # kho rồi, chạy lại trên main thì chặn được gì nữa. Lý do ấy BỎ SÓT một chuyện: cửa chặn trên
  # PR đo nhánh gộp với main TẠI LÚC CHẠY. Hai PR cùng xanh riêng lẻ, gộp lần lượt, cái thứ hai
  # có thể làm đỏ — và vì backend không chạy trên main, KHÔNG AI THẤY.
  #
  # Chuyện đã xảy ra thật, ngày 16/10/2026: PR #370 mở `GET /api/v1/fleet/bhxh-doi-xe` mà chưa
  # khai vào bảng cửa lương đã ký. `test_lg5` đỏ. Nó nằm im trên main cho đến khi PR #367 gộp
  # main vào và ĂN NGUYÊN cái đỏ ấy — làn R3a mất một vòng cho một lỗi không phải của họ.
  #
  # GIÁ PHẢI TRẢ, nói thẳng: mỗi lần gộp tốn thêm ~45 phút máy chạy. Đổi lại, main đỏ thì biết
  # NGAY và biết ĐÍCH DANH lần gộp nào làm đỏ, thay vì để làn sau phát hiện hộ.
  #
  # `docker` GIỮ NGUYÊN điều kiện: nó `needs: [backend, web]` nên trên main nó sẽ chờ thêm 45
  # phút chỉ để dựng một ảnh không ai dùng tới. Hai việc khác nhau, không gộp một quyết định.
  backend:
    needs: loc
    if: needs.loc.outputs.chi_so != '1'
    runs-on: ubuntu-latest
    # Hạn giờ. Thiếu dòng này GitHub lấy mặc định 360 phút MỘT VIỆC, nên một việc treo ăn hết ngân sách
    # mà không ai thấy nó đến — trần đã bị chạm bốn lần: 19/9 · 17/10 · 21/10 · 24/10. Số để RỘNG hơn
    # số đo được nhiều lần, vì hạn giờ chật biến một lượt chậm-nhưng-đúng thành đỏ, và đỏ-vì-hạ-tầng
    # là thứ dạy người ta tắt hàng rào. Đợt CI-1, 25/10/2026.
    timeout-minutes: 90
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app --select E9,F63,F7,F82
      # DANH SÁCH TỆP NHÁNH NÀY ĐỔI — 23/9/2026.
      #
      # `backend/tests/test_giu_cho_nhanh.py` đọc tệp này qua biến VTOS_TEP_DOI và đỏ nếu có tệp mã
      # nào không được một dòng `đang làm` trong sổ giữ chỗ. Từ 06/10/2026 sổ tách ra
      # mỗi làn một tệp: `docs/dang-lam/<làn>.md`, cộng quyển cũ `docs/DANG-LAM.md` vẫn đọc tiếp.
      #
      # VÌ SAO TÍNH Ở ĐÂY MÀ KHÔNG ĐỂ PHÉP THỬ TỰ GỌI GIT: bộ phép thử còn chạy ở hai chỗ không có
      # thư mục .git — máy của người, và hộp cát giải nén từ `git archive`. Một phép thử tự gọi git
      # sẽ lặng lẽ bỏ qua ở hai chỗ ấy, và người viết không biết là nó đang không chạy.
      #
      # Giữ NGUYÊN chuỗi `VTOS_TEP_DOI` và tên bước: test_ci_hang_rao_main.py đọc đúng hai thứ ấy.
      - name: Tep nhanh nay doi
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          git diff --name-only FETCH_HEAD HEAD > "$GITHUB_WORKSPACE/_tep_doi.txt"
          echo "VTOS_TEP_DOI=$GITHUB_WORKSPACE/_tep_doi.txt" >> "$GITHUB_ENV"
          echo "--- nhanh nay doi $(wc -l < "$GITHUB_WORKSPACE/_tep_doi.txt") tep ---"
          cat "$GITHUB_WORKSPACE/_tep_doi.txt"
      - run: bash tests/run_all.sh
  # DỰNG GIAO DIỆN — chạy CẢ trên main từ 12/10/2026, và đây KHÔNG phải vì nó thiếu trên PR.
  #
  # ĐO TRƯỚC KHI SỬA, vì lần đầu em chẩn sai. Lượt CI #750 của PR #290 (MT-1) hiện rõ: `backend`
  # ĐỎ sau 28 phút, `web` ĐỎ sau 35 GIÂY, `hang-rao-gop` ĐỎ sau 49 giây. Tức là việc `web` ĐÃ
  # chạy trên PR và ĐÃ bắt được lỗi `Shell.tsx` trong 35 giây — rồi PR vẫn được gộp với cả ba
  # dấu đỏ. Nên câu "lỗi lọt vào main vì `web` không chạy trên push" là SAI, và nó đã kịp vào sổ
  # làn Vòng ở dòng VA-MAIN10 trước khi có người đi đo; dòng ấy nay đã sửa.
  #
  # VẬY VÌ SAO VẪN CHO NÓ CHẠY TRÊN MAIN. Không phải để bắt lại thứ PR đã bắt — mà để bắt thứ
  # PR KHÔNG THỂ bắt: hai nhánh mỗi nhánh dựng được riêng lẻ, gộp lại thì hỏng. Một nhánh đổi
  # tên một thành phần dùng chung, nhánh kia thêm một chỗ gọi nó theo tên cũ; cả hai đều xanh
  # trên PR của mình. Đúng lý do `hang-rao-gop` đang chạy trên main, chỉ khác là nó canh phía
  # máy chủ còn việc này canh phía giao diện — và tới 12/10/2026 phía giao diện chưa có ai canh.
  #
  # GIÁ PHẢI TRẢ: 1 PHÚT 28 GIÂY mỗi lần gộp — số này đã SỬA một lần, và lần sai đáng ghi lại.
  #
  # Bản đầu của khối chú thích này viết "35 giây", lấy từ lượt `web` ĐỎ của PR #290. Một bản dựng
  # HỎNG chết sớm: `next build` dừng ngay ở tệp không phân tích được, nên 35 giây là thời gian
  # của một lần THẤT BẠI, không phải của một lần chạy xong. Lượt CI #771 — lần gộp đầu tiên theo
  # luật mới, trên main — đo được bản dựng THÀNH CÔNG mất 1 phút 28 giây, cả lượt 1 phút 31 giây
  # (lần gộp ngay trước đó, #769, chỉ 52 giây vì mới có cửa hẹp).
  #
  # Con số sai gấp hai lần rưỡi, và nó là con số dùng để xin quyết định. Kết luận KHÔNG đổi —
  # 1,5 phút vẫn rẻ so với 28 phút của `backend` — nhưng người quyết đã quyết trên một con số
  # trích từ một lượt hỏng. Cùng một tật với ba bài học *cách đo* ở dòng VA-MAIN10: không mở phép
  # đo ra nhìn kỹ xem nó đang đo cái gì.
  #
  # Đây là lý do việc này được chọn mà `backend` (28 phút) và `docker` thì không — cả hai GIỮ
  # NGUYÊN `if:` của chúng.
  #
  # ĐIỀU NÀY KHÔNG CHẶN ĐƯỢC GÌ, nói thẳng để không ai yên tâm nhầm. Trên main, mã đã vào kho
  # rồi; đỏ ở đây chỉ là BÁO. Thứ duy nhất chặn được một lần gộp là ô "Require status checks"
  # trong Settings, và ngày 12/10/2026 GitHub từ chối nó cho kho riêng của tài khoản cá nhân —
  # nguyên văn trang Rulesets: luật "won't be enforced on this private repository until you move
  # to GitHub Team organization account". Chừng nào chưa chuyển, kỷ luật chờ phép kiểm chạy xong
  # vẫn nằm ở NGƯỜI BẤM GỘP, không ở máy.
  #
  # CHỖ HỞ ẤY ĐÃ ĐÓNG ngày 22/10/2026: `cancel-in-progress` nay chỉ bật trên sự kiện
  # `pull_request`, nên hai lần gộp sát nhau vào main đều chạy hết và đều cho tín hiệu. Lý do và
  # số đo ghi ở khối `concurrency` đầu tệp. Ghi lại ở đây vì đây là nơi chỗ hở được phát hiện
  # trước tiên, và người đọc đoạn này cần biết nó không còn nữa.
  #
  # KHÔNG khai `if:` ở việc này — `test_ci8` đỏ nếu ai khai lại.
  web:
    runs-on: ubuntu-latest
    # Hạn giờ. Thiếu dòng này GitHub lấy mặc định 360 phút MỘT VIỆC, nên một việc treo ăn hết ngân sách
    # mà không ai thấy nó đến — trần đã bị chạm bốn lần: 19/9 · 17/10 · 21/10 · 24/10. Số để RỘNG hơn
    # số đo được nhiều lần, vì hạn giờ chật biến một lượt chậm-nhưng-đúng thành đỏ, và đỏ-vì-hạ-tầng
    # là thứ dạy người ta tắt hàng rào. Đợt CI-1, 25/10/2026.
    timeout-minutes: 20
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: 1 }
  docker:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # Hạn giờ. Thiếu dòng này GitHub lấy mặc định 360 phút MỘT VIỆC, nên một việc treo ăn hết ngân sách
    # mà không ai thấy nó đến — trần đã bị chạm bốn lần: 19/9 · 17/10 · 21/10 · 24/10. Số để RỘNG hơn
    # số đo được nhiều lần, vì hạn giờ chật biến một lượt chậm-nhưng-đúng thành đỏ, và đỏ-vì-hạ-tầng
    # là thứ dạy người ta tắt hàng rào. Đợt CI-1, 25/10/2026.
    timeout-minutes: 30
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  # CỬA HẸP — 12 giây. Từ 09/10/2026 chạy CẢ trên PR, KHÔNG chỉ sau khi gộp.
  #
  # VÌ SAO ĐỔI. Trước đó việc này khai `if: github.event_name == 'push'`, nên nó chỉ chạy SAU khi
  # mã đã vào kho: nó BÁO, chứ không CHẶN được gì. Ngày 09/10/2026 main đỏ đúng vì thế — hai làn
  # cùng giữ `backend/app/services/access.py` (dòng VB-1 của làn Phân quyền và dòng PD-1 của làn
  # Vòng đều còn `đang làm`), và `test_giu_cho_lan` đỏ.
  #
  # Điều đáng nói: cửa chặn ĐÃ CÓ mà bị đi vòng. Bộ đủ trên PR #268 CÓ chạy `test_giu_cho_lan` và
  # SẼ đỏ, nhưng nó mất ~37 phút, còn PR được gộp vài phút sau khi mở — lượt ấy đến lúc main đã đỏ
  # vẫn còn trạng thái "In progress". Một cửa chặn mà không ai chờ nổi thì trên thực tế là không có.
  #
  # Nên cửa hẹp nay chạy cả trên PR: 12 giây thì chờ được, và chờ được thì nó CHẶN. Bộ đủ ~37 phút
  # vẫn KHÔNG chạy lại trên main (test_ci4 canh điều ấy), nên giá phải trả là ~50 giây Actions mỗi
  # PR, không phải 37 phút. Bật "Require status checks" cho RIÊNG việc này ở Settings của kho thì
  # mọi lần gộp bị chặn 12 giây thay vì 37 phút — việc ấy nằm ngoài tệp này.
  #
  # KHÔNG khai `if:` ở việc này, và đó là chủ ý: bỏ trống là chạy trên push, pull_request và cả
  # workflow_dispatch. `test_ci7` đỏ nếu ai khai lại một điều kiện chặn nó khỏi push hay khỏi PR.
  # Giữ NGUYÊN TÊN TỆP ở dòng `pytest` bên dưới: test_ci_hang_rao_main.py đọc đúng dòng ấy.
  hang-rao-gop:
    runs-on: ubuntu-latest
    # Hạn giờ. Thiếu dòng này GitHub lấy mặc định 360 phút MỘT VIỆC, nên một việc treo ăn hết ngân sách
    # mà không ai thấy nó đến — trần đã bị chạm bốn lần: 19/9 · 17/10 · 21/10 · 24/10. Số để RỘNG hơn
    # số đo được nhiều lần, vì hạn giờ chật biến một lượt chậm-nhưng-đúng thành đỏ, và đỏ-vì-hạ-tầng
    # là thứ dạy người ta tắt hàng rào. Đợt CI-1, 25/10/2026.
    timeout-minutes: 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app --select E9,F63,F7,F82
      # BƯỚC NÀY CÓ HAI BẢN, Ở HAI VIỆC — và `test_ci6` bắt phải thế.
      #
      # `test_giu_cho_nhanh.py` nằm trong danh sách hàng rào bên dưới, và luật `gn1` của nó BẮT
      # BUỘC phải thấy danh sách tệp nhánh đổi khi đang chạy trên pull_request. Việc `backend`
      # tính danh sách ấy cho bộ đủ; việc này chạy ở một máy khác nên phải tự tính lại. Thiếu
      # bước này thì cửa hẹp đỏ trên MỌI PR — đỏ vì thiếu môi trường, không vì có lỗi thật, và
      # đó là kiểu đỏ làm người ta tắt hàng rào.
      #
      # `test_ci6` không đếm hai bản: nó đọc từng việc, và việc nào chạy hàng rào giữ chỗ nhánh
      # thì việc ấy phải đặt `VTOS_TEP_DOI`. Thêm việc thứ ba cũng tự động bị soi.
      - name: Tep nhanh nay doi
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          git diff --name-only FETCH_HEAD HEAD > "$GITHUB_WORKSPACE/_tep_doi.txt"
          echo "VTOS_TEP_DOI=$GITHUB_WORKSPACE/_tep_doi.txt" >> "$GITHUB_ENV"
          echo "--- nhanh nay doi $(wc -l < "$GITHUB_WORKSPACE/_tep_doi.txt") tep ---"
          cat "$GITHUB_WORKSPACE/_tep_doi.txt"
      - run: python -m pytest -q tests/test_mach_migration.py tests/test_menu.py tests/test_p11_khai_quyen_phai_co_man_hinh.py tests/test_ks_ma_tran.py tests/test_p2_pham_vi_vai_tro.py tests/test_giu_cho_lan.py tests/test_giu_cho_nhanh.py tests/test_ks_do_dai.py tests/test_ks2_khai_quyen_may_doc_duoc.py tests/test_ks_cua_nhap.py tests/test_man_hinh_co_cua_nhap.py tests/test_lg1_hai_bang_quyen_khop_nhau.py tests/test_lg2_mot_bang_chu_ky.py tests/test_ks_toan_quyen.py tests/test_le2b_ba_vai_ke_toan.py tests/test_hach_toan.py tests/test_misa.py tests/test_ds3_chuong_ba_ngay.py tests/test_tz1_mui_gio_mo_duoc_tren_moi_may.py tests/test_tkc1_but_toan_ghi_vao_tai_khoan_cha.py tests/test_r5b2_the_doi_chieu_lai_lo.py tests/test_td1_sales_admin_ma_tour_doan.py tests/test_v341_the_chi_tiet_vay_341.py tests/test_gtgt1_bu_tru_thue_gtgt.py tests/test_cptt1_hai_o_chi_phi_tra_truoc.py tests/test_gtgt2_the_bu_tru_gtgt.py tests/test_cptt2_cot_tk_chi_phi_trong_mau_excel.py tests/test_tkc2_duong_ghi_vao_tai_khoan_cha.py tests/test_tkc3_nan_duong_ghi_ve_tai_khoan_con.py tests/test_tkc4_bon_duong_ghi_tiep_theo.py tests/test_tkc5_hoa_hong_khuyen_mai_tra_truoc.py
