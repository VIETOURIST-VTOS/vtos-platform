# Chạy thật trên VPS với tên miền (Caddy tự lấy HTTPS Let's Encrypt).
#   cp .env.example .env  → điền DOMAIN, mật khẩu, khóa
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vtos
      POSTGRES_USER: vtos
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [vtos_pgdata:/var/lib/postgresql/data, ./infra/backups:/backups]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U vtos -d vtos"], interval: 5s, timeout: 5s, retries: 20 }
    restart: always

  api:
    build: ./backend
    environment:
      ENV: prod
      DATABASE_URL: postgresql+psycopg2://vtos:${DB_PASSWORD}@db:5432/vtos
      SECRET_KEY: ${SECRET_KEY}
      ROBOT_TOKEN: ${ROBOT_TOKEN}
      SEED_DEMO: ${SEED_DEMO:-0}
      CORS_ORIGINS: https://${DOMAIN}
      TZ: Asia/Ho_Chi_Minh
    depends_on: { db: { condition: service_healthy } }
    restart: always

  web:
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on: [api]
    restart: always

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports: ["80:80", "443:443"]
    volumes: [./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro, vtos_caddy_data:/data, vtos_caddy_config:/config]
    depends_on: [web, api]
    restart: always

  n8n:
    image: n8nio/n8n:latest
    profiles: ["auto"]
    environment:
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      N8N_HOST: n8n.${DOMAIN}
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      ROBOT_TOKEN: ${ROBOT_TOKEN}
    volumes: [vtos_n8n:/home/node/.n8n, ./infra/n8n:/workflows:ro]
    restart: always

  backup:
    image: postgres:16-alpine
    profiles: ["auto"]
    environment: { PGPASSWORD: ${DB_PASSWORD} }
    volumes: [./infra/backups:/backups]
    entrypoint: ["sh", "-c", "while true; do pg_dump -h db -U vtos vtos | gzip > /backups/vtos_$(date +%F_%H%M).sql.gz; find /backups -name '*.sql.gz' -mtime +30 -delete; sleep 86400; done"]
    depends_on: [db]
    restart: always

volumes:
  vtos_pgdata:
  vtos_n8n:
  vtos_caddy_data:
  vtos_caddy_config:
