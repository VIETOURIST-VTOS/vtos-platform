# Render Blueprint – triển khai API + PostgreSQL (gói free) cho bản demo trên web.
# Render Dashboard → New → Blueprint → chọn repo này → Apply.
services:
  - type: web
    name: vtos-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENV
        value: prod
      - key: SEED_DEMO
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: ROBOT_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: DATABASE_URL
        fromDatabase:
          name: vtos-db
          property: connectionString

databases:
  - name: vtos-db
    plan: free
    region: singapore
    databaseName: vtos
    user: vtos
