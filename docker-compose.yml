# Môi trường phát triển / chạy thử trên máy: docker compose up -d --build
# Web http://localhost:3000 · API http://localhost:8000/api/docs · n8n (profile auto) http://localhost:5678
services:
  db:
    image: postgres:16-alpine
    container_name: vtos-db
    environment:
      POSTGRES_DB: vtos
      POSTGRES_USER: vtos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vtos_local_2026}
    volumes: [vtos_pgdata:/var/lib/postgresql/data]
    ports: ["5433:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U vtos -d vtos"], interval: 5s, timeout: 5s, retries: 20 }
    restart: unless-stopped

  api:
    build: ./backend
    container_name: vtos-api
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: postgresql+psycopg2://vtos:${DB_PASSWORD:-vtos_local_2026}@db:5432/vtos
      SECRET_KEY: ${SECRET_KEY:-doi-khoa-nay-truoc-khi-chay-that}
      ROBOT_TOKEN: ${ROBOT_TOKEN:-doi-robot-token}
      SEED_DEMO: ${SEED_DEMO:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TZ: Asia/Ho_Chi_Minh
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

  web:
    build: ./web
    container_name: vtos-web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: vtos-n8n
    profiles: ["auto"]
    environment:
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      N8N_SECURE_COOKIE: "false"
      ROBOT_TOKEN: ${ROBOT_TOKEN:-doi-robot-token}
    ports: ["5678:5678"]
    volumes: [vtos_n8n:/home/node/.n8n, ./infra/n8n:/workflows:ro]
    restart: unless-stopped

volumes:
  vtos_pgdata:
  vtos_n8n:
